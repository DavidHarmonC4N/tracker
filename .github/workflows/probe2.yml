name: Probe product details (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print connector facts from product pages
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, time
          urls = ["https://specfive.com/products/spec5-minitrekker-mkii", "https://specfive.com/products/spec5-trekker-kilo", "https://specfive.com/products/spec5-ranger-device", "https://specfive.com/products/spec5-relay-hp", "https://specfive.com/products/specfive-trace-gps-tracker-for-dogs-teams", "https://atlavox.com/products/atlavox-m1", "https://store.rokland.com/products/heltec-mesh-node-t096-nrf52840-gps-lora-node-meshtastic-meshcore-and-lorawan", "https://store.rokland.com/products/rak-wireless-wisblock-meshtastic-starter-kit", "https://muzi.works/products/seeed-t1000e", "https://muzi.works/products/h2t-complete-device-heltec-t114-with-gps-running-meshtastic", "https://ameridroid.com/products/t-echo-meshtastic", "https://ameridroid.com/products/thinknode-m5-meshtastic-radio-1", "https://ameridroid.com/products/thinknode-m9-meshcore-communication-terminal-with-full-keyboard-2-4inch-lcd-esp32-s3-lr1110-gps-2300mah-915-mhz", "https://ameridroid.com/products/atlavox-beacon-solar-meshcore-node-preconfigured", "https://store.rokland.com/products/lowmesh-pocket-s-portable-solar-node-compatible-withmeshtastic-915-mhz", "https://store.rokland.com/products/lowmesh-pocket-m-portable-magnet-magsafe-connecting-meshtastic-node-us-915-mhz", "https://store.rokland.com/products/elecrow-thinknode-m2-lora-meshtastic-signal-transceiver-powered-by-esp32-s3-1-3-oled-display-wo-case", "https://store.rokland.com/products/lilygo-t-deck-portable-microcontroller-programmer-lora-915-mhz-h642", "https://store.rokland.com/products/wismesh-tag-from-rakwireless-mokosmart-meshtastic-compatible-card-sized-node-us915-mhz?variant=44663304552531", "https://atlavox.com/products/51-fiberglass-antenna-868-915mhz-n-type-10dbi", "https://atlavox.com/products/11-fiberglass-antenna-915mhz-n-type-3dbi", "https://atlavox.com/products/32-fiberglass-antenna-915mhz-n-type-5-8dbi", "https://atlavox.com/products/taoglas-9-omnidirectional-antenna-868-915mhz-n-type", "https://atlavox.com/products/gizont-7-whip-antenna-915mhz-rp-sma", "https://atlavox.com/products/gizont-7-whip-antenna-915mhz-sma", "https://atlavox.com/products/7-outdoor-antenna-915mhz-rp-sma-2-5dbi", "https://atlavox.com/products/7-outdoor-antenna-915mhz-sma-2-5dbi", "https://atlavox.com/products/meshtac-8-whip-antenna-915mhz-sma-2-5dbi", "https://atlavox.com/products/alfa-7-outdoor-antenna-915mhz-n-type-5dbi", "https://atlavox.com/products/stock-rubber-duck-antenna-868-915mhz-sma-2dbi", "https://atlavox.com/products/8-swivel-antenna-915mhz-sma-3dbi", "https://atlavox.com/products/12-fiberglass-antenna-868-915mhz-n-type-3dbi", "https://store.rakwireless.com/products/sma-male-915mhz-868mhz-whip-antenna-20cm", "https://store.rakwireless.com/products/5dbi-fiber-glass-antenna-supports-902-928mhz", "https://ameridroid.com/products/heltec-gt-800-omnidirectional-whip-antenna-868-915-mhz-sma", "https://specfive.com/products/8cm-lora-glue-stick-915-mhz-antenna", "https://specfive.com/products/17cm-lora-bendy-antenna-915-mhz", "https://muzi.works/products/4-pack-whip-antenna-17cm-915mhz", "https://muzi.works/products/alfa-outdoor-antenna"]
          pat = re.compile(r'.{0,70}(SMA|U\.FL|IPEX|MHF|N-?type|N-?female|N-?male|antenna (?:port|connector|interface|jack)|connector|length|height|inch|dBi).{0,70}', re.I)
          for url in urls:
              m = re.match(r'https://([^/]+)/products/([a-z0-9._-]+)', url)
              if not m:
                  continue
              try:
                  req = urllib.request.Request('https://%s/products/%s.js' % (m.group(1), m.group(2)), headers={'User-Agent': 'OffgridCommsTracker-Probe/1.0'})
                  with urllib.request.urlopen(req, timeout=20) as r:
                      d = json.load(r)
              except Exception as e:
                  print('## %s  ERROR %s' % (url[:90], str(e)[:50]))
                  continue
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', d.get('description', '')))
              hits = [x.group(0) for x in pat.finditer(text)][:6]
              print('## %s | %s | variants=%d' % (m.group(2)[:60], d['title'][:70], len(d['variants'])))
              for h in hits:
                  print('     ' + h.strip())
              time.sleep(1.5)
          PY
