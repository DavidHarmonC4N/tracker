name: Probe a seller (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Product details
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request
          host = 'shop.meshsmith.net'

          def get(url, limit=3000000):
              req = urllib.request.Request(url, headers={'User-Agent': 'OffgridCommsTracker-Probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read(limit).decode('utf-8', 'replace')
              except Exception as e:
                  return getattr(e, 'code', 0), str(e)[:160]

          for handle in ['ethermesh-1w', 'photon-1w', 'pimesh-1w-basic', '26cm-fiberglass-antenna', '40cm-fiberglass-antenna', 'muzi-whip-antenna-17cm',
                         'outpost-ipex-to-sma-15cm', 'outpost-ipex-to-type-n-25cm', 'outpost-sma-to-type-n-25cm']:
              s, body = get('https://%s/products/%s.js' % (host, handle))
              try:
                  d = json.loads(body)
              except Exception:
                  print('##', handle, 'ERROR', s, body[:100]); continue
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', d.get('description', '')))
              print('## %s | %s | options=%s' % (handle, d['title'], [o['name'] + '=' + '/'.join(o['values'][:6]) for o in d.get('options', [])]))
              for v in d['variants'][:14]:
                  print('   variant: %s | %s | %s' % (v.get('public_title') or v['title'], v['price'], v['available']))
              print('   desc:', text[:900])
              time.sleep(1.5)
          for path in ['/policies/shipping-policy', '/pages/shipping', '/pages/about', '/pages/contact']:
              s, body = get('https://%s%s' % (host, path), 200000)
              text = re.sub(r'\s+', ' ', re.sub(r'<script.*?</script>|<style.*?</style>|<[^>]+>', ' ', body, flags=re.S))
              hits = re.findall(r'.{80}(?:ship(?:s|ped|ping)? from|located in|based in|warehouse|Colorado|Texas|California|Florida|USA|United States).{80}', text, re.I)[:4]
              print(path, s, hits)
          PY
