name: Probe a seller (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Firmware and location facts
        run: |
          python3 - <<'PY'
          import json, re, time, urllib.request

          def get(url, limit=3000000):
              req = urllib.request.Request(url, headers={'User-Agent': 'OffgridCommsTracker-Probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, r.read(limit).decode('utf-8', 'replace')
              except Exception as e:
                  return getattr(e, 'code', 0), str(e)[:160]

          for handle in ['ethermesh-1w', 'photon-1w', 'pimesh-1w-basic']:
              s, body = get('https://shop.meshsmith.net/products/%s.js' % handle)
              d = json.loads(body)
              text = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', d.get('description', '')))
              print('##', handle, len(text))
              for m in re.findall(r'.{90}(?:Meshtastic|MeshCore|firmware|Firmware|LoRa module|SX126|LR11|dBm|\b1 ?W\b|GPS|nRF|ESP32).{90}', text)[:10]:
                  print('   ', m)
              time.sleep(1.2)
          s, js = get('https://meshsmith.net/assets/index-BOouPi_x.js')
          print('## bundle product blocks')
          for key in ['pimesh-1w', 'photon-1w', 'ethermesh-1w']:
              i = js.find('link:"/products/%s"' % key)
              print('  ', key, js[max(0, i - 400):i + 500].replace('\n', ' ') if i >= 0 else 'not found')
          print('## location words:', sorted(set(re.findall(r'\b(?:Colorado|Texas|California|Florida|Ohio|Utah|Arizona|Virginia|Washington|Oregon|Nevada|Georgia|Michigan|Illinois|Tennessee|Carolina|New York|Minnesota|Wisconsin|Pennsylvania)\b', js)))[:12])
          for m in re.findall(r'.{80}(?:ships from|Ships from|made in|Made in|based in|Based in|located in|Located in|designed in|Designed in).{80}', js)[:6]:
              print('   loc:', m.replace('\n', ' '))
          PY
