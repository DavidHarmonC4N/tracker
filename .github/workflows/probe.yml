name: Probe a seller (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Look at the store
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          host = 'meshsmith.net'

          def get(url, limit=3000000):
              req = urllib.request.Request(url, headers={'User-Agent': 'OffgridCommsTracker-Probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return r.status, dict(r.headers), r.read(limit).decode('utf-8', 'replace')
              except Exception as e:
                  return getattr(e, 'code', 0), {}, str(e)[:160]

          s, h, home = get('https://%s/' % host)
          print('HOME HTML:'); print(home)
          s, h, robots = get('https://%s/robots.txt' % host)
          print('ROBOTS (rules):')
          for line in robots.splitlines():
              if line.strip() and not line.startswith('#'):
                  print('  ' + line)
          for src in re.findall(r'(?:src|href)="([^"]+\.(?:js|json))"', home)[:6]:
              url = src if src.startswith('http') else 'https://%s%s' % (host, src if src.startswith('/') else '/' + src)
              s, h, js = get(url)
              print('ASSET', url, s, len(js))
              urls = sorted(set(re.findall(r'https?://[A-Za-z0-9._~:/?#@!$&()*+,;=%-]{6,120}', js)))
              keep = [u for u in urls if not re.search(r'w3\.org|reactjs|github\.com|mozilla|schema\.org|npmjs|fb\.me|google\.com/', u)]
              print('  urls in bundle:', keep[:30])
              for m in sorted(set(re.findall(r'["\'](/(?:api|rest|v1|products|shop|store|catalog)[A-Za-z0-9_/.-]{0,60})["\']', js)))[:30]:
                  print('  path:', m)
              for m in re.findall(r'.{60}(?:price|\$\d+\.\d\d|in.stock|add.to.cart|buy now).{60}', js, re.I)[:8]:
                  print('  hint:', m.replace('\n', ' '))
          PY
