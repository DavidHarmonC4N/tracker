name: Group directory link check

on:
  schedule:
    # Once a month, early in the morning (UTC).
    - cron: '17 7 1 * *'
  workflow_dispatch:

concurrency:
  group: offgrid-links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          tools: none
      - name: Check the group links
        env:
          OFFGRID_URL: ${{ secrets.OFFGRID_URL }}
          OFFGRID_TOKEN: ${{ secrets.OFFGRID_TOKEN }}
        run: php runner/links.php
